name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (${{ matrix.compiler }}, ${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [debug, asan]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  static-analysis:
    name: clang-tidy & cppcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy cppcheck

      - name: Configure (generates compile_commands.json)
        run: cmake --preset debug

      # Build first so FetchContent sources and generated files exist.
      - name: Build
        run: cmake --build --preset debug

      - name: clang-tidy
        run: |
          run-clang-tidy -p build/debug -quiet -warnings-as-errors='*' \
            "$(pwd)/(src|include|tests)/"

      - name: cppcheck
        run: |
          cppcheck --project=build/debug/compile_commands.json \
            --enable=warning,style,performance,portability \
            --std=c++20 --inline-suppr --error-exitcode=1 \
            --suppress='*:*/_deps/*' --suppress=missingIncludeSystem \
            -i build/debug/_deps
